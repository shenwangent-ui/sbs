name: Build Real SBS Search Installers
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Web UI Assets
        run: |
          npm install --legacy-peer-deps
          npx vite build --base=./
          mkdir -p flutter-app/assets/web
          cp -r dist/* flutter-app/assets/web/
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Ensure Permanent Release Keystore Exists
        run: |
          mkdir -p flutter-app/android-signing
          if [ ! -f flutter-app/android-signing/sbs-release.jks ]; then
            keytool -genkey -v -keystore flutter-app/android-signing/sbs-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias sbskey -storepass sbs2026pass -keypass sbs2026pass -dname "CN=SBS Search, OU=Dev, O=Shenwang, L=PathumThani, ST=Thailand, C=TH"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f flutter-app/android-signing/sbs-release.jks
            git commit -m "chore: save permanent release keystore [skip ci]"
            git push
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build & Sign Android APK (Supports In-Place Updates)
        working-directory: flutter-app
        run: |
          flutter create . --platforms=android --org th.shenwang --project-name sbs_search
          sed -i 's/android:label="sbs_search"/android:label="SBS Search"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          rm -rf android/app/src/main/res/mipmap-*
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --build-number=${{ github.run_number }}

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks android-signing/sbs-release.jks \
            --ks-key-alias sbskey \
            --ks-pass pass:sbs2026pass \
            --key-pass pass:sbs2026pass \
            --out build/app/outputs/flutter-apk/SBS-Search.apk \
            build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SBS Search Latest Release
          files: flutter-app/build/app/outputs/flutter-apk/SBS-Search.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & Build Windows Installer (.exe)
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx --yes electron-builder@25 --config electron-builder.json --win --publish never
      - name: Publish EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SBS Search Latest Release
          files: release/SBS-Search.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
