name: Build Real SBS Search Installers
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Web UI Assets
        run: |
          npm install --legacy-peer-deps
          npx vite build --base=./
          mkdir -p flutter-app/assets/web
          cp -r dist/* flutter-app/assets/web/
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build Real Android APK (Exact Web UI & Custom Icon)
        working-directory: flutter-app
        run: |
          flutter create . --platforms=android --org th.shenwang --project-name sbs_search
          sed -i 's/android:label="sbs_search"/android:label="SBS Search"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SBS-Search.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SBS Search Latest Release
          files: flutter-app/build/app/outputs/flutter-apk/SBS-Search.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & Build Windows Installer (.exe)
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx --yes electron-builder@25 --config electron-builder.json --win --publish never
      - name: Publish EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SBS Search Latest Release
          files: release/SBS-Search.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
